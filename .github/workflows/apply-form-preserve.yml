name: Apply Form Preservation Patch

on:
  push:
    branches:
      - feature/complete-structure-tools
    paths:
      - scripts/apply-form-preserve.mjs
      - .github/workflows/apply-form-preserve.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[form-preserve-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-structure-tools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply form preservation
        run: node scripts/apply-form-preserve.mjs
      - name: Verify production build
        run: |
          npm install
          npm run build
      - name: Commit generated integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PDF Forge QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Preserve authored form fields on export [form-preserve-applied]"
          git push origin HEAD:feature/complete-structure-tools
