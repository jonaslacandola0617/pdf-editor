name: Group Document Tools

on:
  push:
    branches:
      - audit/ui-ux-release
    paths:
      - scripts/group-document-tools.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-ux-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/group-document-tools.mjs
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/AdvancedToolsBase.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Group Document Tools into clear workflows"
          git push origin HEAD:audit/ui-ux-release
