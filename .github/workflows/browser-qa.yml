name: Browser QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'fix/**'
      - 'redesign/**'
      - 'chore/**'
  workflow_dispatch:

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Production build check
        run: npm run build

      - name: Run Chromium browser verification
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-chromium
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Run Firefox and WebKit Workbench smoke tests
        run: npm run test:cross-browser

      - name: Upload cross-browser report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-cross-browser
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
