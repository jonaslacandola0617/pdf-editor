name: Apply Native Object UI

on:
  push:
    branches:
      - feature/manage-native-pdf-objects
    paths:
      - scripts/apply-native-object-ui.mjs
      - .github/workflows/apply-native-object-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-object-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manage-native-pdf-objects
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-native-object-ui.mjs
      - run: |
          npm install
          npm run build
      - name: Commit verified integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PDF Forge QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Integrate native PDF object manager [native-object-ui-applied]"
          git push origin HEAD:feature/manage-native-pdf-objects
