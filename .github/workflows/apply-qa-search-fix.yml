name: Apply QA Test Adjustment

on:
  push:
    branches:
      - qa/browser-verification
    paths:
      - .github/workflows/apply-qa-search-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/browser-verification

      - name: Use native input setter for range QA
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path('tests/pdf-forge.spec.ts')
          text = test.read_text()
          old = """  await range.evaluate((el: HTMLInputElement) => {
    el.value = '7'
    el.dispatchEvent(new Event('input', { bubbles: true }))
    el.dispatchEvent(new Event('change', { bubbles: true }))
  })"""
          new = """  await range.evaluate((el: HTMLInputElement) => {
    const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set
    setter?.call(el, '7')
    el.dispatchEvent(new Event('input', { bubbles: true }))
    el.dispatchEvent(new Event('change', { bubbles: true }))
  })"""
          if old not in text:
              raise SystemExit('Expected range QA block not found')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit QA test adjustment
        run: |
          git config user.name "PDF Forge QA"
          git config user.email "actions@users.noreply.github.com"
          git add tests/pdf-forge.spec.ts
          git commit -m "Use native range setter in browser QA"
          git push origin HEAD:qa/browser-verification
