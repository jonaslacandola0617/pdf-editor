name: Apply QA Test Adjustment

on:
  push:
    branches:
      - qa/browser-verification
    paths:
      - .github/workflows/apply-qa-search-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/browser-verification

      - name: Wait for Signature tool state before drawing
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path('tests/pdf-forge.spec.ts')
          text = test.read_text()
          old = """  await page.getByTitle('Signature').click()
  await dragOnPdf(page, 0.62, 0.54, 0.82, 0.61)"""
          new = """  const signatureTool = page.getByTitle('Signature')
  await signatureTool.click()
  await expect(signatureTool).toHaveClass(/active/)
  await dragOnPdf(page, 0.62, 0.54, 0.82, 0.61)"""
          if old not in text:
              raise SystemExit('Expected signature QA block not found')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit QA test adjustment
        run: |
          git config user.name "PDF Forge QA"
          git config user.email "actions@users.noreply.github.com"
          git add tests/pdf-forge.spec.ts
          git commit -m "Wait for signature tool activation in browser QA"
          git push origin HEAD:qa/browser-verification
