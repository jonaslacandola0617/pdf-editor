name: Apply QA Test Adjustment

on:
  push:
    branches:
      - qa/browser-verification
    paths:
      - .github/workflows/apply-qa-search-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/browser-verification

      - name: Move signature QA stroke away from floating navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path('tests/pdf-forge.spec.ts')
          text = test.read_text()
          old = "await dragOnPdf(page, 0.20, 0.83, 0.48, 0.88)"
          new = "await dragOnPdf(page, 0.62, 0.54, 0.82, 0.61)"
          if old not in text:
              raise SystemExit('Expected signature test coordinates not found')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit QA test adjustment
        run: |
          git config user.name "PDF Forge QA"
          git config user.email "actions@users.noreply.github.com"
          git add tests/pdf-forge.spec.ts
          git commit -m "Keep signature QA stroke clear of floating controls"
          git push origin HEAD:qa/browser-verification
