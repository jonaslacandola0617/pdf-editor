name: Apply Structure UI Patch

on:
  push:
    branches:
      - feature/complete-structure-tools
    paths:
      - scripts/apply-structure-ui.mjs
      - .github/workflows/apply-structure-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[structure-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-structure-tools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply structure UI integration
        run: node scripts/apply-structure-ui.mjs
      - name: Verify production build
        run: |
          npm install
          npm run build
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "PDF Forge QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Integrate PDF structure authoring tools [structure-ui-applied]"
          git push origin HEAD:feature/complete-structure-tools
