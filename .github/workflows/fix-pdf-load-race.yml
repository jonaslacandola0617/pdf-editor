name: Fix PDF Load Race

on:
  push:
    branches:
      - feature/complete-structure-tools
    paths:
      - scripts/fix-pdf-load-race.mjs
      - .github/workflows/fix-pdf-load-race.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-load-race-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-structure-tools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-pdf-load-race.mjs
      - run: |
          npm install
          npm run build
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PDF Forge QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Ignore stale PDF loads and clarify tool labels [pdf-load-race-fixed]"
          git push origin HEAD:feature/complete-structure-tools
