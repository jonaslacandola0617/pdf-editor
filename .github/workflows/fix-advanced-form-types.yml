name: One-shot advanced form type fix

on:
  push:
    branches:
      - feature/advanced-form-widgets
    paths:
      - .github/workflows/fix-advanced-form-types.yml
      - .github/advanced-form-type-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-form-widgets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict type fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/advanced-forms.ts')
          s = p.read_text()
          s = s.replace('  PDFDict,\n', '')
          old = "export type FormDataPayload = {\n  version: 1\n  values: Record<string, string | string[] | boolean | null>\n}"
          new = "export type FormDataValue = string | string[] | boolean | null\n\nexport type FormDataPayload = {\n  version: 1\n  values: Record<string, FormDataValue>\n}"
          if old not in s:
              raise SystemExit('FormDataPayload pattern not found')
          s = s.replace(old, new)
          old2 = "  const values = source.values\n  if (!values || typeof values !== 'object') throw new Error('Form JSON must contain a values object.')"
          new2 = "  const values = source.values as Record<string, FormDataValue> | undefined\n  if (!values || typeof values !== 'object') throw new Error('Form JSON must contain a values object.')"
          if old2 not in s:
              raise SystemExit('values pattern not found')
          s = s.replace(old2, new2)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Remove one-shot workflow and commit fix
        run: |
          rm -f .github/workflows/fix-advanced-form-types.yml .github/advanced-form-type-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strict advanced form data types"
          git push origin HEAD:feature/advanced-form-widgets
