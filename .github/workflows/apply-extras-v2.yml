name: Apply Extras V2 Patch

on:
  push:
    branches:
      - feature/complete-extras-v2
    paths:
      - scripts/apply-extras-v2.mjs
      - .github/workflows/apply-extras-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[extras-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-extras-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply editor state integration
        run: node scripts/apply-extras-v2.mjs
      - name: Verify TypeScript production build
        run: |
          npm install
          npm run build
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "PDF Forge QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Integrate comments and reusable signatures [extras-v2-applied]"
          git push origin HEAD:feature/complete-extras-v2
