name: Apply Extras State Patch

on:
  push:
    branches:
      - feature/complete-extras
    paths:
      - scripts/apply-extras-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[extras-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-extras
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply state integration patch
        run: node scripts/apply-extras-patch.mjs
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "PDF Forge QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Integrate notes and reusable signatures [extras-applied]"
          git push origin HEAD:feature/complete-extras
