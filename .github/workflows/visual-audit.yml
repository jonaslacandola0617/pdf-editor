name: Visual UX Audit

on:
  push:
    branches:
      - audit/ui-ux-release
      - 'redesign/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build check
        run: npm run build

      - name: Run visual audit
        run: npx playwright test tests/visual-ux-audit.spec.ts --project=chromium

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-ux-audit
          path: |
            visual-audit
            playwright-report
            test-results
          if-no-files-found: ignore
